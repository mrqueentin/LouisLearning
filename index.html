<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vui Học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --sky:#bfe6ff; --sky2:#e9f7ff;
  --ink:#1d2a44; --muted:#55627d; --card:#ffffff; --line:#d7e3f2;
  --red:#ff5a5f; --orange:#ff9f1c; --yellow:#ffd23f; --green:#2bb673; --blue:#2f80ed; --purple:#8e5cf7;
  --display:'Baloo 2',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
/* Trang vừa khít màn hình, không cuộn: nội dung đặt giữa và tự thu nhỏ (JS fit() bên dưới) */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 55%,#f4fbe9 100%) fixed;background-color:var(--sky2);
  color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{width:100%;max-width:720px;flex:none;transform-origin:center center}
.bunting{display:flex;justify-content:space-between;margin:0 -4px 6px}
.bunting i{width:6%;aspect-ratio:1/1.1;clip-path:polygon(0 0,100% 0,50% 100%)}
.hero{text-align:center;margin:10px 0 24px}
.hero h1{font-family:var(--display);font-size:clamp(2.2rem,9vw,3.4rem);font-weight:800;margin:0;line-height:1.05;letter-spacing:-.5px}
.hero h1 span{color:var(--red)}
.hero p{margin:6px 0 0;color:var(--muted);font-weight:800;font-size:1.1rem}
.subjects{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:560px){.subjects{grid-template-columns:1fr 1fr}}
.subject{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink);background:var(--card);
  border-radius:26px;padding:20px;border:4px solid transparent;box-shadow:0 6px 0 var(--shadow),0 10px 24px rgba(30,60,120,.08);
  transition:transform .12s, box-shadow .12s}
.subject:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow),0 6px 14px rgba(30,60,120,.08)}
.subject:focus-visible{outline:none;border-color:var(--blue)}
@media (min-width:560px){.subject{flex-direction:column;text-align:center;padding:28px 20px}}
.subject .ic{flex:none;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;font-size:52px;background:var(--tint)}
.subject h2{font-family:var(--display);font-size:1.9rem;font-weight:800;margin:0;line-height:1.1}
.subject p{margin:4px 0 0;color:var(--muted);font-weight:700}
.subject .go{display:inline-block;margin-top:10px;font-weight:800;color:#fff;background:var(--accent);border-radius:999px;padding:6px 18px}
.math{--accent:var(--blue);--tint:#e2efff;--shadow:#bcd6f7}
.math h2{color:var(--blue)}
.eng{--accent:var(--red);--tint:#ffe5e6;--shadow:#f6c3c5}
.eng h2{color:var(--red)}
.lb{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;text-decoration:none;color:#6b3f00;
  background:linear-gradient(180deg,#ffe066,#ffc93c);border-radius:999px;padding:14px 20px;font-family:var(--display);font-weight:800;
  font-size:1.45rem;box-shadow:0 5px 0 #e0a100,0 10px 20px rgba(224,161,0,.18)}
.lb:active{transform:translateY(4px);box-shadow:0 1px 0 #e0a100}
.lb:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.lb .cup{font-size:1.7rem;line-height:1}
.ground{margin-top:22px;display:flex;justify-content:space-around;font-size:34px;background:#7ccf6a;border-radius:20px 20px 0 0;padding:8px 6px 4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bunting" aria-hidden="true">
    <i style="background:#ff5a5f"></i><i style="background:#ff9f1c"></i><i style="background:#ffd23f"></i><i style="background:#2bb673"></i>
    <i style="background:#2f80ed"></i><i style="background:#8e5cf7"></i><i style="background:#ff5a5f"></i><i style="background:#ff9f1c"></i>
    <i style="background:#ffd23f"></i><i style="background:#2bb673"></i><i style="background:#2f80ed"></i><i style="background:#8e5cf7"></i>
  </div>

  <header class="hero">
    <h1>Vui <span>Học</span></h1>
    <p>Hôm nay em muốn học môn gì?</p>
  </header>

  <main class="subjects">
    <a class="subject math" href="math.html">
      <div class="ic" aria-hidden="true">🔢</div>
      <div>
        <h2>Môn Toán</h2>
        <p>Luyện tập tính toán vui nhộn</p>
        <span class="go">Vào học ➜</span>
      </div>
    </a>
    <a class="subject eng" href="english.html">
      <div class="ic" aria-hidden="true">🔤</div>
      <div>
        <h2>Môn Tiếng Anh</h2>
        <p>Move up 5 · Học theo từng Unit</p>
        <span class="go">Vào học ➜</span>
      </div>
    </a>
  </main>

  <a class="lb" href="leaderboard.html"><span class="cup" aria-hidden="true">🏆</span> Bảng xếp hạng</a>

  <div class="ground" aria-hidden="true"><span>🌳</span><span>🌷</span><span>🎪</span><span>🌼</span><span>🌳</span><span>🎠</span></div>
</div>
<script src="lessons.js"></script>
<script>
/* Thu nhỏ nội dung cho vừa chiều cao màn hình (không phóng to quá cỡ gốc) */
(function(){
  var w = document.querySelector(".wrap");
  function fit(){
    w.style.transform = "none";
    var cs = getComputedStyle(document.body);
    var availH = document.body.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var s = Math.min(1, availH / w.offsetHeight);
    if (s < 1) w.style.transform = "scale(" + s.toFixed(4) + ")";
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  try { document.fonts.ready.then(fit); } catch (e) {}
})();
</script>
</body>
</html>
